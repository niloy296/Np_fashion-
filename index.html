<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Np Fashion - Online Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Top Navigation -->
  <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
        <i class="fa-solid fa-bag-shopping text-2xl text-pink-500"></i>
        <span class="text-xl font-bold tracking-wide">Np Fashion</span>
      </div>
      <div class="flex items-center gap-6">
        <button onclick="navigate('home')" class="hover:text-pink-400 font-medium">Home</button>
        <button onclick="navigate('cart')" class="relative hover:text-pink-400">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span id="cartBadge" class="absolute -top-2 -right-3 bg-pink-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <div id="authLinks" class="flex gap-3">
          <button onclick="navigate('login')" class="bg-pink-600 px-4 py-1.5 rounded hover:bg-pink-700 text-sm font-semibold">Login</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Dynamic Container -->
  <main id="app" class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- Dynamic Views Injected Here -->
  </main>

  <footer class="bg-slate-900 text-gray-400 text-center py-6 mt-auto">
    <p>&copy; 2026 Np Fashion. All Rights Reserved.</p>
  </footer>

  <script>
    const API_URL = 'http://localhost:5000/api';
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let token = localStorage.getItem('token') || null;
    let user = JSON.parse(localStorage.getItem('user')) || null;

    function updateCartBadge() {
      const count = cart.reduce((acc, item) => acc + item.qty, 0);
      document.getElementById('cartBadge').innerText = count;
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateAuthUI() {
      const authDiv = document.getElementById('authLinks');
      if (token && user) {
        authDiv.innerHTML = `
          <span class="text-sm font-medium self-center text-pink-300">Hello, ${user.name}</span>
          ${user.role === 'admin' ? '<button onclick="navigate(\'admin\')" class="bg-amber-600 px-3 py-1 rounded text-xs font-bold">Admin Panel</button>' : ''}
          <button onclick="logout()" class="bg-red-600 px-3 py-1 rounded text-xs font-bold hover:bg-red-700">Logout</button>
        `;
      } else {
        authDiv.innerHTML = `<button onclick="navigate('login')" class="bg-pink-600 px-4 py-1.5 rounded hover:bg-pink-700 text-sm font-semibold">Login</button>`;
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      token = null;
      user = null;
      updateAuthUI();
      navigate('home');
    }

    async function navigate(view) {
      const app = document.getElementById('app');
      updateCartBadge();
      updateAuthUI();

      if (view === 'home') {
        app.innerHTML = '<h2 class="text-2xl font-bold mb-6">Np Fashion Collection</h2><div id="productGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"><p>Loading products...</p></div>';
        try {
          const res = await fetch(`${API_URL}/products`);
          const products = await res.json();
          const grid = document.getElementById('productGrid');
          if (products.length === 0) {
            grid.innerHTML = '<p class="text-gray-500">No products found. (Add via Admin Panel)</p>';
            return;
          }
          grid.innerHTML = products.map(p => `
            <div class="bg-white rounded-lg shadow border p-4 flex flex-col justify-between">
              <div>
                <img src="${p.images[0] || 'https://via.placeholder.com/300'}" class="h-40 w-full object-cover rounded mb-4">
                <h3 class="font-bold text-lg mb-1">${p.name}</h3>
                <p class="text-gray-600 text-sm mb-2">${p.description.substring(0, 60)}...</p>
                <p class="text-pink-600 font-bold text-xl mb-4">৳${p.price}</p>
              </div>
              <button onclick="addToCart('${p._id}', '${p.name}', ${p.price}, '${p.images[0] || ''}')" class="w-full bg-pink-600 text-white py-2 rounded font-semibold hover:bg-pink-700">Add to Cart</button>
            </div>
          `).join('');
        } catch (err) {
          app.innerHTML = `<p class="text-red-500">Backend Server disconnected (${API_URL})</p>`;
        }
      } else if (view === 'cart') {
        if (cart.length === 0) {
          app.innerHTML = '<div class="text-center py-12"><h2 class="text-2xl font-bold text-gray-600">Your Cart is Empty</h2></div>';
          return;
        }
        let total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
        app.innerHTML = `
          <h2 class="text-2xl font-bold mb-6">Shopping Cart</h2>
          <div class="bg-white rounded-lg shadow p-6 max-w-3xl mx-auto">
            ${cart.map((item, idx) => `
              <div class="flex justify-between items-center border-b py-3">
                <div>
                  <h4 class="font-bold">${item.name}</h4>
                  <p class="text-gray-500 text-sm">৳${item.price} x${item.qty}</p>
                </div>
                <div class="flex items-center gap-4">
                  <span class="font-bold text-pink-600">৳${item.price * item.qty}</span>
                  <button onclick="removeFromCart(${idx})" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
            `).join('')}
            <div class="flex justify-between font-bold text-xl my-6">
              <span>Total Amount:</span>
              <span class="text-pink-600">৳${total}</span>
            </div>
            <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded font-bold hover:bg-green-700">Place Order (Cash on Delivery)</button>
          </div>
        `;
      } else if (view === 'login') {
        app.innerHTML = `
          <div class="max-w-md mx-auto bg-white p-8 rounded shadow">
            <h2 class="text-2xl font-bold mb-6 text-center">Login to Np Fashion</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <div>
                <label class="block text-sm font-semibold mb-1">Email</label>
                <input type="email" id="loginEmail" required class="w-full border rounded p-2">
              </div>
              <div>
                <label class="block text-sm font-semibold mb-1">Password</label>
                <input type="password" id="loginPassword" required class="w-full border rounded p-2">
              </div>
              <button type="submit" class="w-full bg-pink-600 text-white py-2 rounded font-bold hover:bg-pink-700">Login</button>
            </form>
          </div>
        `;
      } else if (view === 'admin') {
        if (!user || user.role !== 'admin') {
          app.innerHTML = '<p class="text-red-500 text-center font-bold">Access Denied. Admin Privileges Required.</p>';
          return;
        }
        app.innerHTML = `
          <h2 class="text-2xl font-bold mb-6">Np Fashion - Admin Dashboard</h2>
          <div class="bg-white p-6 rounded shadow mb-8">
            <h3 class="text-lg font-bold mb-4">Add New Product</h3>
            <form onsubmit="handleAddProduct(event)" class="grid grid-cols-2 gap-4">
              <input type="text" id="pName" placeholder="Product Name" required class="border p-2 rounded">
              <input type="number" id="pPrice" placeholder="Price (BDT)" required class="border p-2 rounded">
              <input type="text" id="pCat" placeholder="Category" required class="border p-2 rounded">
              <input type="number" id="pStock" placeholder="Stock Quantity" required class="border p-2 rounded">
              <input type="text" id="pImage" placeholder="Image URL" required class="border p-2 rounded col-span-2">
              <textarea id="pDesc" placeholder="Description" required class="border p-2 rounded col-span-2"></textarea>
              <button type="submit" class="bg-pink-600 text-white py-2 rounded font-bold col-span-2">Create Product</button>
            </form>
          </div>
        `;
      }
    }

    function addToCart(id, name, price, image) {
      const existing = cart.find(item => item.product === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ product: id, name, price, image, qty: 1 });
      }
      updateCartBadge();
      alert('Product added to cart');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      navigate('cart');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          token = data.token;
          user = { id: data._id, name: data.name, email: data.email, role: data.role };
          localStorage.setItem('token', token);
          localStorage.setItem('user', JSON.stringify(user));
          alert('Login Successful');
          navigate('home');
        } else {
          alert(data.message || 'Login Failed');
        }
      } catch (err) {
        alert('Server Error');
      }
    }

    async function handleAddProduct(e) {
      e.preventDefault();
      const product = {
        name: document.getElementById('pName').value,
        price: Number(document.getElementById('pPrice').value),
        category: document.getElementById('pCat').value,
        stock: Number(document.getElementById('pStock').value),
        images: [document.getElementById('pImage').value],
        description: document.getElementById('pDesc').value
      };

      const res = await fetch(`${API_URL}/products`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(product)
      });

      if (res.ok) {
        alert('Product Added Successfully!');
        navigate('home');
      } else {
        alert('Failed to add product');
      }
    }

    async function checkout() {
      if (!token) {
        alert('Please login to place an order.');
        navigate('login');
        return;
      }
      const orderData = {
        orderItems: cart,
        shippingAddress: { address: 'Main Street', city: 'Dhaka', phone: '01700000000' },
        paymentMethod: 'COD',
        totalPrice: cart.reduce((acc, item) => acc + (item.price * item.qty), 0)
      };

      const res = await fetch(`${API_URL}/orders`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(orderData)
      });

      if (res.ok) {
        alert('Order Placed Successfully!');
        cart = [];
        updateCartBadge();
        navigate('home');
      } else {
        alert('Checkout Failed');
      }
    }

    navigate('home');
  </script>
</body>
</html>
